<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f8fafc" />
    <meta
      name="description"
      content="Simple GST billing and invoice management for Indian small businesses, stored in your browser."
    />
    <title>GST Desk — Billing made clear</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
    <script
      defer
      src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/3.0.3/jspdf.umd.min.js"
    ></script>
    <script
      defer
      src="https://unpkg.com/jspdf-autotable@5.0.2/dist/jspdf.plugin.autotable.js"
    ></script>
    <script defer src="./storage.js"></script>
    <script defer src="./data.js"></script>
    <script defer src="./ui.js"></script>
    <script defer src="./invoices.js"></script>
    <script defer src="./settings.js"></script>
    <script defer src="./documents.js"></script>
    <script defer src="./app.js"></script>
  </head>
  <body>
    <div id="toast-root" class="toast-root" aria-live="polite"></div>
    <div id="app-shell" class="app-shell">
      <div class="mobile-overlay" data-action="menu"></div>
      <aside id="sidebar" class="sidebar" aria-label="Main navigation"></aside>
      <div class="app-main">
        <header id="topbar" class="topbar"></header>
        <section id="page-content" class="page-content" tabindex="-1"></section>
      </div>
    </div>
    <div id="modal-root"></div>
  </body>
</html>
